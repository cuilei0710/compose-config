services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODEX_VERSION: latest
        DSH_VERSION: latest

    container_name: ai-dev

    volumes:
      - ~/Developer:/workspace
      - codex-data:/home/node/.codex
      - dsh-data:/home/node/.dsh

    stdin_open: true
    tty: true

volumes:
  codex-data:
    external: true
  dsh-data:
    external: true
