services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODEX_VERSION: ${CODEX_VERSION:-latest}
        DSH_VERSION: ${DSH_VERSION:-latest}

    image: ai-dev:latest
    container_name: ai-dev

    network_mode: host

    working_dir: /workspace

    volumes:
      - ~/Developer:/workspace
      - codex-config:/home/node/.codex
      - dsh-config:/home/node/.dsh
      - pnpm-store:/pnpm/store

    init: true
    stop_grace_period: 2s
    tty: true
    restart: unless-stopped

volumes:
  codex-config:
    external: true
  dsh-config:
    external: true
  pnpm-store:
    external: true
